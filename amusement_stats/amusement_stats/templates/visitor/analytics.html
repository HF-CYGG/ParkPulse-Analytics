{% extends "visitor/base.html" %}

{% block title %}数据洞察{% endblock %}

{% block content %}

  <div class="mb-4">

    <h1 class="h3 fw-bold mb-2">数据洞察</h1>

    <p class="text-muted small mb-0">
      图表数据来源于系统内<strong>游玩记录表的真实入库数据</strong>：按游玩时间字段统计，近 14 日逐日合计条数、近 7 日按小时（0–23 时）合计条数。可拖动与缩放交互查看。
    </p>

  </div>

  <div class="visitor-card p-3 p-md-4 shadow-sm">

    {{ plot_html|safe }}

  </div>

{% endblock %}
